<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion par Signature</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
  <style>
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
    .card { max-width: 500px; margin: 4rem auto; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
    canvas { background: white; border: 2px dashed #ccc; border-radius: 12px; width: 100%; height: 220px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card p-4">
      <h2 class="text-center mb-4">Connexion par Signature</h2>
      <canvas id="signature-pad"></canvas>
      <div class="d-grid gap-3 mt-4">
        <button id="clear" class="btn btn-outline-danger">Effacer</button>
        <button id="register" class="btn btn-outline-primary">S'inscrire avec cette signature</button>
        <button id="login" class="btn btn-success btn-lg">Se connecter</button>
      </div>
      <div id="msg" class="mt-3 text-center fw-bold fs-5"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('signature-pad');
    const pad = new SignaturePad(canvas);
    const msg = document.getElementById('msg');

    function resize() {
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      canvas.getContext('2d').scale(ratio, ratio);
      pad.clear();
    }
    window.addEventListener('resize', resize);
    resize();

    document.getElementById('clear').onclick = () => { pad.clear(); msg.innerHTML = ''; };

    async function send(action) {
      if (pad.isEmpty()) return alert("Dessinez votre signature !");
      const username = prompt("Votre identifiant")?.trim().toLowerCase();
      if (!username) return;
      const data = pad.toDataURL();
      const res = await fetch(`/${action}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({signature: data, username})
      });
      const json = await res.json();
      if (json.success) {
        msg.innerHTML = '<span class="text-success">Connexion réussie !</span>';
        setTimeout(() => location.href = '/dashboard', 1000);
      } else {
        msg.innerHTML = `<span class="text-danger">Refusée (distance ${json.distance || '?'})</span>`;
      }
    }

    document.getElementById('register').onclick = () => send('register');
    document.getElementById('login').onclick = () => send('login');
  </script>
</body>
</html>
